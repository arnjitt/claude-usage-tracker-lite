[package]
name = "claude-usage-tracker"
version = "0.1.3"
description = "Portable meters for Claude session / weekly / per-model limits"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
